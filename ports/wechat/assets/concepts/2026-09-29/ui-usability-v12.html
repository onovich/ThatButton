  <section class="notes">
    <h1>v12 可用性修订</h1>
    <p>运营评审后，局内底栏改为我方与考官两组信息，显示连击剩余时间并把“威力 +3”写成“伤害加成 +3”；三枚已按按钮做下沉效果，保留原属性色与勾选。黄色 04 的图形改为深蓝，结算规则改成“当时别按”。首页与结算角色、背景、按钮布局及底部分镜均沿用 <a href="hybrid-ui-v11-unified-thin-rim.png">v11 造型基准</a>。</p>
    <p>这是静态 UI 方案。连击剩余时间、伤害加成、结果原因和规则文字应由前端绑定真实游戏状态；长规则、小屏、连续点击与动效干扰仍需真机试玩。</p>
