<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视觉干扰 · 实际效果预览</title>
<style>
body{margin:0;padding:28px;background:#f5f3eb;color:#101f48;font:16px/1.6 system-ui,sans-serif}main{max-width:900px;margin:auto}h1{font-size:26px;margin:0}p{max-width:760px}button{padding:10px 18px;border:2px solid #101f48;border-radius:12px;background:#ffe35c;color:#101f48;font:inherit;cursor:pointer;margin:0 8px 10px 0}.grid{display:flex;gap:28px;flex-wrap:wrap}h2{font-size:18px}iframe{width:320px;height:568px;border:2px solid #101f48;border-radius:16px;background:#fffdf4}#status{min-height:26px}
</style>
<main><h1>短暂视觉干扰</h1><p><a href="hazard-lab.html">打开新版：漂移交换 / Unity 切片 / RoomAxioms 色差撕裂 →</a></p>
<p>这里调用游戏实际 Canvas 渲染器。按钮区域覆盖透明度 7% 的细白横线，每条高 2 像素、间隔 17 像素。当前效果很淡，不改变按钮或判断规则。示例棋盘固定，仅用于看效果。</p>
<button id="hold">保持干扰，方便对比</button><button id="play">播放一次（持续 1.2 秒）</button>
<div id="status" aria-live="polite">右侧保持干扰状态</div>
<div class="grid"><section><h2>正常状态</h2><iframe title="正常棋盘" src="visual-preview.html?mode=game&w=320&h=568&safe=46&combo=3"></iframe></section>
<section><h2>干扰状态</h2><iframe id="effect" title="干扰棋盘" src="visual-preview.html?mode=game&w=320&h=568&safe=46&combo=3&hazard=interference"></iframe></section></div>
<p>真实关卡中，干扰在开始计时约 5.7 秒后出现，持续 1.2 秒；此处播放按钮缩短等待，便于检查。</p></main>
<script>
const frame=document.getElementById('effect'),status=document.getElementById('status');let timers=[];
function set(active,text){frame.contentWindow.postMessage({type:'preview-interference',active},'*');status.textContent=text}
function clear(){timers.forEach(clearTimeout);timers=[]}
document.getElementById('hold').onclick=()=>{clear();set(true,'右侧保持干扰状态')};
document.getElementById('play').onclick=()=>{clear();set(false,'准备播放…');timers.push(setTimeout(()=>{set(true,'干扰中（1.2 秒）');timers.push(setTimeout(()=>set(false,'播放结束，已恢复正常'),1200))},600))};
</script></html>
