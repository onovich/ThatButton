    .screen[data-size="390"] .duo-sprite { width:350px;height:117px; }
    .screen[data-size="390"] .combo-fx { width:110px;height:42px;top:1px; }
    .screen[data-size="390"] .combo-fx strong { font-size:16px;line-height:20px; }
    .screen[data-size="390"] .combo-fx small { font-size:10px;line-height:13px; }
    .screen[data-safe="46"] .stage-footer { height:105px; }
    .screen[data-safe="46"] .duo-sprite { width:165px;height:55px; }
    .screen[data-safe="46"] .combo-fx { top:1px; }
    /* v11 rule lettering, stopwatch and companion landscape. */
    .rule { min-height:87px;padding:4px 8px 6px;border-radius:16px;background:radial-gradient(ellipse at 50% 7%,#ffdde5 0%,#fff1f4 46%,#fffdf8 100%);box-shadow:0 3px 0 #d7bdc4,0 0 0 3px #fff; }
    .rule-label,.rule-text,.time-row strong { font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;font-weight:1000; }
    .rule-label { font-size:19px;line-height:23px;color:var(--navy);-webkit-text-stroke:.35px var(--navy);text-shadow:0 1px 0 #fff; }
    .rule-text { font-size:17px;line-height:22px;letter-spacing:-.035em;-webkit-text-stroke:.15px var(--navy); }
    .rule-text em { color:#ee152e;font-size:1.1em;-webkit-text-stroke:.3px #ee152e; }
    .rule-text .clause { display:inline-block;white-space:nowrap;margin:0 .09em; }
    .vitals,.time-row { height:44px; }
    .time-row strong { display:flex;align-items:center;justify-content:center;gap:4px;font-size:22px;line-height:29px;letter-spacing:.01em;-webkit-text-stroke:.3px var(--navy); }
    .stopwatch { display:block;width:22px;height:22px;flex:none; }
    .time-row .track { height:11px;margin-top:1px;background:#d8eafb; }
    .time-row .track i { background:linear-gradient(#9cffb4,#3bd872); }
    .combo-fx { flex-direction:row;gap:1px;background:linear-gradient(#fffdf0,#ffe9a0); }
    .combo-fx::before { display:none; }
    .combo-bolt { flex:none;font-size:18px;line-height:1;filter:drop-shadow(1px 1px 0 var(--navy)); }
    .combo-copy { display:flex;flex-direction:column;align-items:center;justify-content:center; }
    .combo-copy strong { font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;font-size:13px;line-height:16px;font-weight:1000;color:var(--navy);-webkit-text-stroke:.2px var(--navy); }
    .combo-copy small { font-size:8px;line-height:10px;font-weight:900;color:#604c32; }
    .combo-fx.danger .combo-bolt { color:#d2294e; }
    .stage-footer { background:#fffdf5; }
    .stage-footer::before { content:"";position:absolute;z-index:0;left:0;right:0;top:0;bottom:55px;border-radius:28px 28px 0 0;background:url("gameplay-landscape-v15.png") center bottom / 100% 100% no-repeat; }
    .screen[data-size="390"] .rule { min-height:106px;padding:6px 12px 8px; }
    .screen[data-size="390"] .rule-label { font-size:25px;line-height:30px; }
    .screen[data-size="390"] .rule-text { font-size:21px;line-height:27px; }
    .screen[data-size="390"] .vitals,.screen[data-size="390"] .time-row { height:56px; }
    .screen[data-size="390"] .time-row strong { font-size:28px;line-height:36px; }
    .screen[data-size="390"] .stopwatch { width:29px;height:29px; }
    .screen[data-size="390"] .time-row .track { height:13px; }
    .screen[data-size="390"] .combo-bolt { font-size:23px; }
    .screen[data-size="390"] .combo-copy strong { font-size:16px;line-height:20px; }
    .screen[data-size="390"] .combo-copy small { font-size:10px;line-height:12px; }
    .screen[data-size="390"] .stage-footer::before { bottom:66px; }
    .screen[data-safe="46"] .rule { min-height:77px;padding:3px 7px 4px; }
    .screen[data-safe="46"] .rule-label { font-size:17px;line-height:20px; }
    .screen[data-safe="46"] .rule-text { font-size:16px;line-height:20px; }
    .screen[data-safe="46"] .vitals,.screen[data-safe="46"] .time-row { height:39px; }
    .screen[data-safe="46"] .time-row strong { font-size:20px;line-height:25px; }
    .screen[data-safe="46"] .stopwatch { width:20px;height:20px; }
    .screen[data-safe="46"] .stage-footer::before { bottom:49px; }
    /* Imagegen study translated into editable raised blocks and recessed sockets. */
    .tile { display:block;position:relative;padding:0;border:3px solid var(--navy);border-radius:16px;background:linear-gradient(180deg,var(--wall),var(--deep));box-shadow:0 7px 0 var(--wall),0 8px 0 var(--navy),0 11px 7px #07194432;overflow:visible; }
    .tile::before,.tile::after { display:none; }
    .tile-face { position:absolute;inset:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;background:linear-gradient(180deg,#ffffffd8 0%,#ffffff54 11%,transparent 26%),linear-gradient(180deg,var(--shine) 0%,var(--top) 24%,var(--base) 84%,var(--deep) 100%);box-shadow:inset 0 0 0 2px #ffffff80,inset 0 3px 0 #fffdf4,inset 0 -4px 0 #07194424; }
    .tile-face::before { content:"";position:absolute;left:8px;right:8px;top:5px;height:12px;border-radius:50%;background:linear-gradient(180deg,#ffffffe8,#ffffff00);pointer-events:none; }
    .tile-face .shape,.tile-face .number { position:relative;z-index:1; }
    .tile.pressed { transform:translateY(6px);border-color:#071944;background:linear-gradient(180deg,#071739,#244c83);box-shadow:inset 0 6px 10px #020b25ad,inset 0 0 0 2px #3b6ba9,0 1px 0 var(--navy),0 3px 4px #07194430;filter:none; }
    .tile.pressed .tile-face { inset:8px 7px 5px;border:2px solid var(--deep);border-radius:9px;background:linear-gradient(180deg,#ffffff82 0%,transparent 29%),linear-gradient(180deg,var(--top),var(--base));box-shadow:0 3px 5px #02091f96,inset 0 2px 0 #ffffff91,inset 0 -3px 0 #0719442d; }
    .tile.pressed .tile-face::before { left:6px;right:6px;top:3px;height:8px;opacity:.55; }
    .tile.wrong { transform:translateY(6px);border-color:#071944;background:linear-gradient(180deg,#071739,#244c83);box-shadow:inset 0 6px 10px #020b25ad,inset 0 0 0 2px #3b6ba9,0 0 0 3px #f34364,0 3px 4px #07194430;filter:none; }
    .tile.wrong .tile-face { inset:8px 7px 5px;border:2px solid var(--deep);border-radius:9px;background:linear-gradient(180deg,#ffffff82 0%,transparent 29%),linear-gradient(180deg,var(--top),var(--base));box-shadow:0 3px 5px #02091f96,inset 0 2px 0 #ffffff91,inset 0 -3px 0 #0719442d; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const params = new URLSearchParams(location.search);
    const size = params.get('size') || '320';
    const dims = {'320':[320,568], '360':[360,640], '390':[390,844]};
    const [w,h] = dims[size] || dims['320'];
    document.documentElement.style.setProperty('--w',w+'px');
    document.documentElement.style.setProperty('--h',h+'px');
    const grid = params.get('grid') || '3x3';
    const variant = params.get('variant') || 'normal';
    const shapes = {
      triangle:'<path d="M16 3 29 28H3Z" fill="currentColor"/>',
      circle:'<circle cx="16" cy="16" r="12" fill="currentColor"/>',
      square:'<rect x="4" y="4" width="24" height="24" rx="2" fill="currentColor"/>',
      star:'<path d="m16 2 4.1 9.1L30 12l-7.5 6.6 2.2 10L16 23.3l-8.7 5.3 2.2-10L2 12l9.9-.9Z" fill="currentColor"/>'
    };
    const tile = (color,shape,number,pressed=false,wrong=false) => `<button class="tile ${color}${pressed?' pressed':''}${wrong?' wrong':''}" aria-label="${pressed?'已按下 ':''}${color} ${shape} ${number}"><span class="tile-face"><svg class="shape" viewBox="0 0 32 32" aria-hidden="true">${shapes[shape]}</svg><span class="number">${number}</span></span></button>`;
    const examples = {
      '3x3': {level:16,score:900,rule:'<span class="clause">颜色为<em>红色</em></span><span class="clause">且形状为<em>三角形</em></span><span class="clause">且数字为<em>3</em></span>',timer:'8.4',hp:82,max:100,progress:350,target:500,combo:'连击 4 · 接续剩 2.1 秒',cols:3,rows:3,buttons:[['red','triangle','03'],['blue','circle','08'],['purple','square','12',true],['yellow','star','05'],['red','circle','10',true],['purple','triangle','07'],['blue','triangle','02',true],['red','square','09'],['yellow','circle','04']]},
      '2x3': {level:4,score:120,rule:'数字为<em>奇数</em>',timer:'11.2',hp:100,max:100,progress:58,target:500,combo:'连击 1 · 接续剩 2.2 秒',cols:3,rows:2,buttons:[['red','triangle','03'],['blue','circle','08',true],['purple','square','12'],['yellow','star','04'],['red','circle','10'],['blue','triangle','02']]},
      '2x2': {level:1,score:0,rule:'颜色为<em>红色</em>',timer:'17.8',hp:100,max:100,progress:0,target:500,combo:'连击尚未开始',cols:2,rows:2,buttons:[['red','triangle','03'],['blue','circle','08'],['purple','square','12'],['yellow','star','04']]}
    };
    const e = examples[grid] || examples['3x3'];
    if (variant === 'wrong' && grid === '3x3') { e.hp=64;e.buttons[0][3]=true;e.buttons[0][4]=true; }
    if (variant === 'critical' && grid === '3x3') { e.timer='1.2';e.timePct=10;e.hp=18;e.max=124;e.combo='连击已中断'; }
    if (variant === 'progress-near' && grid === '3x3') { e.progress=486;e.combo='连击已中断'; }
    if (params.get('page') === 'buttons') {
      const samples=[['red','triangle','03'],['blue','circle','08'],['yellow','star','05'],['purple','square','12'],['red','circle','10'],['blue','triangle','02'],['yellow','circle','04'],['purple','triangle','07']];
      document.getElementById('app').innerHTML=`<section class="component-board"><h1>v15 · 同一实体按钮的两种状态</h1><p>四种属性色、四种图形；未按是有彩色侧壁的凸起积木，已按是彩色面缩进深蓝底座。颜色、形状、数字始终保留；未按状态不提示答案。</p><div class="component-grid">${samples.map((s,i)=>`<div class="component-pair"><h2>${['红三角 03','蓝圆 08','黄星 05','紫方 12','红圆 10','蓝三角 02','黄圆 04','紫三角 07'][i]}</h2>${tile(...s)}${tile(...s,true)}<div class="label">凸起 · 未按</div><div class="label">凹陷 · 已按</div></div>`).join('')}</div><div class="component-foot"><article><h2>误按后的短反馈</h2><span class="sample">误按 · 体力 −18</span><br>只在真实误按后出现；若玩家仍存活，按钮留在已按的凹陷状态。没有勾号，也不让未按按钮变色。</article><article><h2>动态绑定</h2>按钮颜色、图形、数字取自 buttons[]；按下取 isClicked。误按扣血取 lastPlayerDamage.appliedDamage。绘制和触摸命中共用同一个按钮矩形。</article></div></section>`;
    } else {
      const hp=e.hp; const hpPercent=Math.min(100,100*hp/e.max); const progressPercent=100*e.progress/e.target;
      const comboCount=e.combo.match(/连击\s*(\d+)/)?.[1];
      const comboSeconds=e.combo.match(/(\d+(?:\.\d+)?)\s*秒/)?.[1];
      const comboLabel=variant==='wrong'?'连击中断':comboCount?`${comboCount} 连击`:e.combo.includes('中断')?'连击中断':'连击待命';
      const comboHint=variant==='wrong'?'体力 −18':comboSeconds?`接续 ${comboSeconds} 秒`:'点亮安全键';
      document.getElementById('app').innerHTML=`<section class="screen" data-size="${size}" data-safe="${params.get('safe')||'0'}" data-grid="${grid}" style="--cols:${e.cols};--rows:${e.rows}" aria-label="${grid} 局内原画"><header class="head"><div class="level">第 ${e.level} 关</div><div class="combo-fx${variant==='wrong'?' danger':''}" aria-label="${comboLabel}，${comboHint}"><span class="combo-bolt" aria-hidden="true">${variant==='wrong'?'!':'⚡'}</span><span class="combo-copy"><strong>${comboLabel}</strong><small>${comboHint}</small></span></div><div class="score"><b>${e.score}</b><span>分</span></div></header><section class="rule"><div class="rule-label">本轮别按：</div><div class="rule-text">${e.rule}</div></section><section class="vitals"><div class="time-row${Number(e.timer)<3?' danger':''}"><strong><svg class="stopwatch" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 2h8M16 3v4M24 7l2 2M16 8a11 11 0 1 1 0 22 11 11 0 0 1 0-22Zm0 10 4-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>${e.timer} 秒</strong><span class="track"><i style="width:${e.timePct||61}%"></i></span></div></section><section class="board" aria-label="${grid} 按钮">${e.buttons.map(b=>tile(...b)).join('')}</section><section class="stage-footer" aria-label="完整的双角色与状态"><img class="duo-sprite" src="brain-glove-separated-v15.png" alt="完整的大脑与手指角色"><div class="stats-panel"><section class="bottom-stat hp-stat"><div class="stat-top"><span>♥ 体力</span><b>${hp}/${e.max}</b></div><span class="track"><i style="width:${hpPercent}%"></i></span></section><section class="bottom-stat progress-stat"><div class="stat-top"><span>★ 挑战进度</span><b>${e.progress}/${e.target}</b></div><span class="track"><i style="width:${progressPercent}%"></i></span></section></div></section></section>`;
    }
  </script>
</body>
</html>
